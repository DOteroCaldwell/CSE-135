<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#182B49"/>
    <title>NCWA Team at UC San Diego</title>
    <link rel="icon" href="media/favicon.ico">
    <!-- Source Sans 3 Font (self-hosted) -->
    <link rel="preload" href="fonts/SourceSans3-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="fonts/fonts.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="home">

    <!-- Desktop Navigation Bar (Hidden on Mobile) -->
    <nav class="site-nav site-nav--fixed">
        <div class="container">
            <div class="site-nav__row">
                <!-- Logo -->
                <a href="/" class="site-nav__brand">
                    <div class="site-nav__logo">
                      <img src="media/Trident_Gold.svg" alt="">
                    </div>
                    <div>
                        <h1 class="site-nav__title">Club Wrestling at UC San Diego</h1>
                    </div>
                </a>

                <!-- Desktop Menu Links -->
                <div class="site-nav__links">
                    <a href="/about" class="site-nav__link">About</a>
                    <a href="/schedule" class="site-nav__link">Schedule</a>
                    <a href="/join" class="site-nav__link">Join</a>
                    <a href="/connect" class="site-nav__link">Connect</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Mobile Bottom Navigation Bar (Visible only on Mobile) -->
    <!-- This replaces the hamburger menu for 1-touch access -->
    <nav class="tab-bar">
        <div class="tab-bar__row">
            <!-- Active Link (Home) -->
            <a href="/" class="tab-bar__link is-active">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="icon">
                    <path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8" />
                    <path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                </svg>
                <span class="tab-bar__label">Home</span>
            </a>

            <!-- Inactive Links -->
            <a href="/about" class="tab-bar__link">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="icon">
                    <circle cx="12" cy="12" r="10" />
                    <path d="M12 16v-4" />
                    <path d="M12 8h.01" />
                </svg>
                <span class="tab-bar__label">About</span>
            </a>

            <a href="/schedule" class="tab-bar__link">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="icon">
                    <path d="M8 2v3" />
                    <path d="M16 2v3" />
                    <rect x="3" y="3" width="18" height="18" rx="2" />
                    <path d="M3 9h18" />
                </svg>
                <span class="tab-bar__label">Times</span>
            </a>

            <a href="/join" class="tab-bar__link">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="icon">
                    <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
                    <circle cx="9" cy="7" r="4" />
                    <line x1="19" x2="19" y1="8" y2="14" />
                    <line x1="22" x2="16" y1="11" y2="11" />
                </svg>
                <span class="tab-bar__label">Join</span>
            </a>

            <a href="/connect" class="tab-bar__link">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="icon">
                    <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
                    <path d="M16 3.128a4 4 0 0 1 0 7.744" />
                    <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
                    <circle cx="9" cy="7" r="4" />
                </svg>
                <span class="tab-bar__label">Connect</span>
            </a>
        </div>
    </nav>

    <!-- Full Screen Minimal Hero -->
    <main class="hero">
        <!-- Background Carousel -->
        <div class="hero__slides">
            <!-- Image 1 -->
            <img src="media/media-day.jpg"
                 alt="Inagural Co-ed Team"
                 class="hero__slide is-active">

            <!-- Image 2 -->
            <img src="media/takedown.JPG"
                 alt="Wrestlers Training"
                 class="hero__slide">

            <!-- Image 3 -->
            <img src="media/w-team.jpg"
                 alt="Inagural Womens Team"
                 class="hero__slide">

            <!-- Image 4 -->
            <img src="media/sam.JPG"
                 alt="Wrestler grabs drink of water"
                 class="hero__slide">

            <!-- Image 5 -->
            <img src="media/team_fall25.jpeg"
                 alt="Fall 2025 Wrestling Team"
                 class="hero__slide">

            <!-- Image 6 -->
            <img src="media/andy.JPG"
                 alt="Coach Cook"
                 class="hero__slide">

            <!-- Image 7 -->
            <img src="media/freestyle.JPG"
                 alt="Takedown in Competition"
                 class="hero__slide">

            <!-- Permanent Gradient Overlay (Ensures text readability on all slides) -->
            <div class="hero__overlay"></div>
        </div>

        <!-- Minimal Content -->
        <div class="container hero__content">

            <!-- Mobile Logo (Visible only on mobile to save header space) -->
            <div class="hero__logo">
                <img src="media/Trident_Gold.svg" alt="">
            </div>

            <h2 class="hero__eyebrow">
                Est. 2024 • UC San Diego
            </h2>

            <h1 class="hero__title">
                TRITON<br>
                WRESTLING
            </h1>

            <p class="hero__lead">
                Student-led NCWA wrestling team at UC San Diego
            </p>

            <div class="hero__actions">
                <a href="/join" class="hero__btn hero__btn--primary">
                    Start Wrestling
                </a>
                <a href="/schedule" class="hero__btn hero__btn--ghost">
                    Schedule
                </a>
            </div>

            <!-- Social Proof / Footer-like element inside Hero -->
            <div class="hero__social">

                <a href="https://www.instagram.com/ucsdwrestlingclub/" class="hero__social-link">
                    <div class="ig-glyph"></div>
                </a>

                <a href="mailto:clubwrestling@ucsd.edu" class="hero__social-link">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="icon">
                        <path d="m22 7-8.991 5.727a2 2 0 0 1-2.009 0L2 7" />
                        <rect x="2" y="4" width="20" height="16" rx="2" />
                    </svg>
                </a>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script>
        // Carousel Logic
        document.addEventListener('DOMContentLoaded', () => {
            const slides = document.querySelectorAll('.hero__slide');
            let currentSlide = 0;
            const slideInterval = 5000; // 5 seconds

            setInterval(() => {
                // Fade out current
                slides[currentSlide].classList.remove('is-active');

                // Calculate next
                currentSlide = (currentSlide + 1) % slides.length;

                // Fade in next
                slides[currentSlide].classList.add('is-active');
            }, slideInterval);
        });
    </script>
</body>
</html>
